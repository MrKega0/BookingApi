services:
  postgres:
    image: postgres:18
    container_name: booking-postgres
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: BookingApi-app
    env_file:
      - ./.env
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 15s

volumes:
  postgres_data:
