<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>

<body>
    <h1>{{title}}</h1>
    <div id="cars-container">
        <!-- Car data will be populated here -->
    </div>
    <div id="booking-result" role="status"></div>
    <section>
        <h2>Бронирования</h2>
        <ul id="bookings-container"></ul>
    </section>

<script>
    const bookingResult = document.getElementById("booking-result");
    const bookingsContainer = document.getElementById("bookings-container");

    document.addEventListener("DOMContentLoaded", () => {
        loadCars();
        loadBookings();
    });

    async function loadCars() {
        const response = await fetch("/api/cars");
        const cars = await response.json();
        if (!cars || cars.length === 0) {
            document.getElementById("cars-container").innerHTML = "<p>Машины не найдены.</p>";
            return;
        }
        cars.forEach(car => {
            const carElement = document.createElement("div");
            carElement.innerHTML = `<h2>${car.brand}</h2><p>${car.model}</p>`;
            document.getElementById("cars-container").appendChild(carElement);

            const bookButton = document.createElement("button");
            bookButton.textContent = "Забронировать";
            bookButton.addEventListener("click", async () => {
                bookButton.disabled = true;
                try {
                    await bookCar(car.id);
                } finally {
                    bookButton.disabled = false;
                }
            });
            carElement.appendChild(bookButton);
        });
    }

    async function loadBookings() {
        try {
            const response = await fetch("/api/bookings");
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            const bookings = await response.json();
            const items = bookings.map(booking => {
                const item = document.createElement("li");
                item.textContent = `Бронь №${booking.id} · Машина ID ${booking.car_id} · ${booking.date_from} — ${booking.date_to} · ${booking.status}`;
                return item;
            });
            if (items.length === 0) {
                const item = document.createElement("li");
                item.textContent = "Бронирований пока нет.";
                items.push(item);
            }
            bookingsContainer.replaceChildren(...items);
        } catch {
            const item = document.createElement("li");
            item.textContent = "Не удалось загрузить бронирования.";
            bookingsContainer.replaceChildren(item);
        }
    }

    async function bookCar(car_id) {
        const bookingData = {
            car_id: car_id,
            customer_name: "leha",
            customer_phone: "+79999999999",
            date_from: "2027-11-13T17:40:34.504",
            date_to: "2027-11-14T17:40:34.504",
            status: "active"
        }
        try {
            const response = await fetch("/api/bookings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(bookingData)
            });
            if (response.status === 409) {
                const result = await response.json();
                bookingResult.textContent = result.detail;
            } else if (response.ok) {
                const result = await response.json();
                bookingResult.textContent = `Бронирование №${result.id} создано.`;
                await loadBookings();
            } else {
                bookingResult.textContent = `Не удалось создать бронирование (HTTP ${response.status}).`;
            }
        } catch {
            bookingResult.textContent = "Не удалось создать бронирование. Попробуйте ещё раз.";
        }
    }
</script>
</body>

</html>
